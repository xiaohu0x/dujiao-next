name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 与 release 相同的前端构建路径（fullstack：admin 注入 __DJ_ADMIN_BASE__ 占位符）
      - name: Build frontend (admin + user)
        run: |
          (cd frontend/admin && pnpm install --frozen-lockfile && pnpm run build:fullstack)
          (cd frontend/user  && pnpm install --frozen-lockfile && pnpm run build)
          rm -rf internal/web/dist && mkdir -p internal/web/dist
          cp -r frontend/admin/dist internal/web/dist/admin
          cp -r frontend/user/dist  internal/web/dist/user

      - name: Build linux/amd64 (fullstack)
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -tags release,fullstack -trimpath \
            -ldflags "-s -w -X github.com/dujiao-next/internal/version.Version=dev-${GITHUB_SHA::7} -X github.com/dujiao-next/internal/version.BuildType=release" \
            -o dist-linux/dujiao-next ./cmd/server

      - name: Quick smoke test
        run: |
          ./dist-linux/dujiao-next -mode api &
          PID=$!
          sleep 5
          curl -fsS http://127.0.0.1:8080/health || { kill $PID; exit 1; }
          kill $PID

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dujiao-next-linux-amd64
          path: dist-linux/dujiao-next
          retention-days: 7
